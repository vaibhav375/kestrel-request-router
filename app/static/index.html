<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Request Router</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
    --accent: #1f5f8b; --high: #1e7a46; --medium: #a86a00; --low: #b3372b; --chip: #efeee9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 24px 8px; max-width: 1080px; margin: 0 auto; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 1080px; margin: 0 auto; padding: 12px 24px 40px; display: grid;
         grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 12px 16px 32px; } header { padding: 16px 16px 4px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase;
          letter-spacing: .04em; margin: 12px 0 4px; }
  textarea, select, input { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid var(--line);
          border-radius: 7px; background: #fff; color: var(--ink); }
  textarea { min-height: 96px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  button { font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid var(--line); background: #fff;
           padding: 8px 12px; color: var(--ink); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600;
                   margin-top: 14px; width: 100%; padding: 10px; }
  button.primary:disabled { opacity: .6; cursor: wait; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .examples button { font-size: 13px; padding: 5px 9px; background: var(--chip); border-color: transparent; }
  .empty { color: var(--muted); padding: 30px 6px; text-align: center; }
  .team { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; margin: 2px 0 6px; }
  .eyebrow { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; }
  .badge.high { background: var(--high); } .badge.medium { background: var(--medium); } .badge.low { background: var(--low); }
  .meta { color: var(--muted); font-size: 13px; margin-left: 6px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
  ul.reasons { margin: 0; padding-left: 18px; } ul.reasons li { margin: 4px 0; }
  .alts { display: flex; gap: 6px; flex-wrap: wrap; }
  .alts span { background: var(--chip); border-radius: 6px; padding: 3px 8px; font-size: 13px; }
  .clarify { border: 1px solid #f0d6a8; background: #fff8ec; border-radius: 8px; padding: 12px; margin-top: 14px; }
  .clarify p { margin: 0 0 8px; font-weight: 600; }
  .clarify .opts { display: grid; gap: 6px; }
  .clarify .opts button { text-align: left; }
  .clarify .opts button.chosen { border-color: var(--accent); background: #e8f1f8; font-weight: 600; }
  .picked { margin-top: 8px; font-size: 14px; }
  .error { color: var(--low); background: #fdeeec; border: 1px solid #f3c9c3; padding: 10px; border-radius: 7px; }
  details { margin-top: 16px; } details pre { background: #f3f2ee; padding: 10px; border-radius: 7px; overflow: auto;
            font-size: 12px; max-height: 320px; }
  footer { max-width: 1080px; margin: 0 auto; padding: 0 24px 24px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Kestrel request router</h1>
  <p>Paste a customer's opening message. The router picks the team that usually closes requests like it, and says why.</p>
</header>
<main>
  <section class="panel" aria-label="Request">
    <form id="f">
      <label for="text">Customer message or IVR transcript</label>
      <textarea id="text" required maxlength="2000" placeholder="e.g. water purifier leaking water from bottom, already paid in full"></textarea>
      <div class="examples" aria-label="Examples">
        <button type="button" data-t="water purifier not turning on paid on upi pls call back">Mentions payment</button>
        <button type="button" data-t="pls help - is ceiling fan safe for kids, ceiling fan leaking water from bottom">Two requests</button>
        <button type="button" data-t="urgent: please call back regarding water purifier">Vague</button>
        <button type="button" data-t="installer did not turn up for air fryer order KO1234567">Installation</button>
        <button type="button" data-t="the jar lid of my mixer cracked on day two">New wording</button>
      </div>
      <div class="row">
        <div><label for="channel">Channel</label>
          <select id="channel"><option value="">–</option><option>chat</option><option>whatsapp</option><option>ivr</option><option>email</option></select></div>
        <div><label for="product">Product</label>
          <select id="product"><option value="">–</option><option>Water Purifier</option><option>Air Fryer</option><option>Mixer Grinder</option>
            <option>Induction Cooktop</option><option>Room Heater</option><option>Ceiling Fan</option><option>Robot Vacuum</option></select></div>
        <div><label for="warranty">Warranty</label>
          <select id="warranty"><option value="">–</option><option value="in_warranty">in warranty</option><option value="shield">Shield</option>
            <option value="out_of_warranty">out of warranty</option></select></div>
      </div>
      <label for="rid">Request ID (optional)</label>
      <input id="rid" placeholder="SR510822">
      <button class="primary" id="go" type="submit">Route this request</button>
    </form>
  </section>
  <section class="panel" aria-live="polite" id="out"><div class="empty">The routing decision and its reasons appear here.</div></section>
</main>
<footer id="foot">Runs locally. No paid API. </footer>
<script>
const $ = (id) => document.getElementById(id);
const pctText = (p) => (p >= 0.995 && p < 1) ? ">99%" : (p > 0 && p < 0.005) ? "<1%" : Math.round(p * 100) + "%";
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

document.querySelectorAll(".examples button").forEach(b => b.addEventListener("click", () => { $("text").value = b.dataset.t; $("text").focus(); }));

fetch("/health").then(r => r.json()).then(h => {
  $("foot").textContent = h.status === "ok"
    ? `Model ${h.model_version} · trained on ${h.trained_on_requests.toLocaleString()} past requests up to ${h.trained_until} · runs locally, no paid API.`
    : (h.message || "Router not ready.");
}).catch(() => { $("foot").textContent = "Cannot reach the router service."; });

$("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const body = { request_text: $("text").value.trim() };
  if (!body.request_text) return;
  if ($("rid").value.trim()) body.request_id = $("rid").value.trim();
  if ($("channel").value) body.channel = $("channel").value;
  if ($("product").value) body.product_family = $("product").value;
  if ($("warranty").value) body.warranty_status = $("warranty").value;
  $("go").disabled = true; $("go").textContent = "Routing…";
  try {
    const res = await fetch("/route", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "The request was not valid: " + JSON.stringify(data.detail));
    render(data);
  } catch (e) {
    const out = $("out"); out.replaceChildren(el("div", "error", e.message || "Something went wrong."));
  } finally { $("go").disabled = false; $("go").textContent = "Route this request"; }
});

function render(d) {
  const out = $("out"); out.replaceChildren();
  out.append(el("div", "eyebrow", d.needs_clarification ? "Best guess – check with the customer" : "Send to"));
  out.append(el("div", "team", d.team));
  const line = el("div");
  line.append(el("span", "badge " + d.confidence_level, d.confidence_level + " confidence"));
  line.append(el("span", "meta", d.route_type === "new_wording"
    ? "new wording – estimate, not history" : `${pctText(d.confidence)} of similar past requests closed here`));
  out.append(line);

  if (d.needs_clarification && d.clarifying_question) {
    const box = el("div", "clarify");
    box.append(el("p", null, "Ask: " + d.clarifying_question.question));
    const opts = el("div", "opts"); const picked = el("div", "picked");
    d.clarifying_question.options.forEach(o => {
      const b = el("button", null, o.label); b.type = "button";
      b.addEventListener("click", () => {
        opts.querySelectorAll("button").forEach(x => x.classList.remove("chosen")); b.classList.add("chosen");
        picked.textContent = `Customer's answer → route to ${o.team}.`;
      });
      opts.append(b);
    });
    box.append(opts, picked); out.append(box);
  }

  out.append(el("h3", null, "Why"));
  const ul = el("ul", "reasons"); d.reasons.forEach(r => ul.append(el("li", null, r))); out.append(ul);

  if (d.alternatives && d.alternatives.length > 1) {
    out.append(el("h3", null, "Other likely teams" + (d.alternatives_basis ? " – " + d.alternatives_basis : "")));
    const a = el("div", "alts");
    d.alternatives.forEach(x => a.append(el("span", null, `${x.team} ${pctText(x.share)}`)));
    out.append(a);
  }
  const det = el("details"); det.append(el("summary", null, "Raw response (JSON)"), el("pre", null, JSON.stringify(d, null, 2)));
  out.append(det);
}
</script>
</body>
</html>
